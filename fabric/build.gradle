plugins {
    id "java"
    id "org.jetbrains.kotlin.jvm"
    id "dev.architectury.loom"
    id "org.jetbrains.gradle.plugin.idea-ext"
    id "maven-publish"
}

evaluationDependsOn(":xplat")

group = project.maven_group

base {
    archivesName = project.archives_base_name + "-fabric"
}

apply from: 'https://dblsaiko.net/pub/gradle/autoversion.gradle'

loom {
    mods {
        create("hctm_base") {
            sourceSet(sourceSets.main)
            sourceSet(project(":xplat").sourceSets.main)
        }
    }
}

repositories {
    maven { url 'https://maven.dblsaiko.net' }
    // maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://maven.kneelawk.com/releases/' }
}

dependencies {
    minecraft group: "com.mojang", name: "minecraft", version: minecraft_version
    mappings loom.layered {
        mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
        mappings "dev.architectury:yarn-mappings-patch-neoforge:${yarn_patch}"
    }
    modImplementation group: "net.fabricmc", name: "fabric-loader", version: fabric_loader_version

    modImplementation group: "net.fabricmc.fabric-api", name: "fabric-api", version: fabric_version
    implementation(group: "net.fabricmc", name: "fabric-language-kotlin", version: fabric_kotlin_version) {
        exclude module: 'fabric-loader'
    }
    
    compileOnly(project(path: ":xplat", configuration: "namedElements"))

    modApi group: 'com.kneelawk.graphlib', name: 'graphlib-core-fabric', version: graphlib_version
    include group: 'com.kneelawk.graphlib', name: 'graphlib-core-fabric', version: graphlib_version

    modRuntimeOnly group: 'com.kneelawk.graphlib', name: 'graphlib-debugrender-fabric', version: graphlib_version
    include group: 'com.kneelawk.graphlib', name: 'graphlib-debugrender-fabric', version: graphlib_version
}

processResources {
    from project(":xplat").sourceSets.main.resources
    inputs.property 'version', project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    source project(":xplat").sourceSets.main.kotlin
    kotlinOptions.jvmTarget = '21'
    kotlinOptions.freeCompilerArgs += '-Xuse-experimental=kotlin.ExperimentalUnsignedTypes'
    kotlinOptions.freeCompilerArgs += '-Xjvm-default=all'
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
    source project(":xplat").sourceSets.main.java
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${archives_base_name}" }
    }
}

sourcesJar.configure {
    from(project(":xplat").sourceSets.main.allSource)
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${rootProject.name}-${project.name}"
            // add all the jars that should be included when publishing to maven
            from components.java
        }
    }

    // select the repositories you want to publish to
    repositories {
        // uncomment to publish to the local maven
        // mavenLocal()
    }
}

apply from: 'https://dblsaiko.net/pub/gradle/publish-slim.gradle'
